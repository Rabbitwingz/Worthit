<title>Worth It · Icon concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,400..900,0..100&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FBF8FC; --card: #F5F2F7; --on: #1B1B21; --muted: #47464F; --chip: #E4DFFF; --on-chip: #1C1259; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Google Sans Flex", system-ui, sans-serif; background: var(--bg); color: var(--on); padding: 40px 16px 80px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 850; letter-spacing: -0.03em; font-variation-settings: "ROND" 100; }
  .lede { color: var(--muted); font-size: 18px; margin-top: 8px; max-width: 46em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 32px; }
  .card { background: var(--card); border-radius: 32px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .hero { display: flex; justify-content: center; padding: 8px 0; }
  .hero svg { width: 168px; height: 168px; border-radius: 50%; box-shadow: 0 10px 30px -10px rgba(40,30,110,.35); }
  .masks { display: flex; gap: 12px; justify-content: center; align-items: center; }
  .masks svg { width: 56px; height: 56px; }
  .masks .sq { border-radius: 18px; }
  .masks .rs { border-radius: 30%; }
  .masks .home { padding: 10px 12px; border-radius: 18px; background: linear-gradient(135deg, #3a3170, #1f4536); display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; font-size: 11px; }
  .masks .home svg { width: 44px; height: 44px; border-radius: 50%; }
  .num { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--chip); color: var(--on-chip); font-weight: 800; font-size: 15px; margin-right: 8px; }
  h2 { font-size: 21px; font-weight: 750; display: flex; align-items: center; font-variation-settings: "ROND" 100; }
  p { color: var(--muted); font-size: 15px; line-height: 1.5; }
</style>

<div class="wrap">
  <h1>Worth It · 8 icon concepts</h1>
  <p class="lede">Each is drawn on Android's 108×108 adaptive-icon grid with the key art inside the safe zone, so it survives any launcher mask. Previews are cropped exactly as a launcher would. Big = circle mask; small row = squircle, rounded square and real home-screen size.</p>
  <div class="grid" id="grid"></div>
</div>

</svg></template>

<script>
  const META = [
    ['Cookie hourglass', 'The current icon, refined: an expressive Material “cookie” coin holding an hourglass. Calm, clear, very on-brand.'],
    ['Coin clock', 'A gold coin that is literally a clock. Money ↔ time in a single glance. Warm gold on deep sage.'],
    ['Sand into love', 'An hourglass where golden sand falls and lands as a heart. Your time becoming something you love.'],
    ['Price-tag timer', 'A tilted price tag with a clock face in it. Every price is a time price. Playful, readable at any size.'],
    ['Weighing it up', 'A balance scale with a coin on one side and a heart on the other, and the heart wins. The question, “is it worth it?”, drawn.'],
    ['Happy coin', 'A cheerful scalloped coin mascot with a sparkle. The friendliest, most playful option, pure delight on a home screen.'],
    ['Day grid', 'A calendar showing the app’s signature dot grid: days filling up like little pies, with a gold coin. Straight from the product.'],
    ['Worth it ✓', 'A big confident check on a clover shape with four little clock ticks. The verdict: definitely worth it.'],
  ];
  const SHAPES = { cookie9: [9, .07], cookie12: [12, .045], clover4: [4, .2], clover8: [8, .12] };
  const FIT = { i1: .8, i2: .8, i3: .76, i4: .9, i5: .96, i6: .8, i7: .92, i8: .8 };
  function shapePath(name, r, cx = 54, cy = 54, rotDeg = 0) {
    const [n, a] = SHAPES[name], N = 180, rot = rotDeg * Math.PI / 180, scale = r / (1 + a);
    const pts = Array.from({ length: N }, (_, i) => {
      const t = i / N * Math.PI * 2, k = 1 + a * Math.cos(n * t);
      return [cx + scale * k * Math.cos(t + rot), cy + scale * k * Math.sin(t + rot)];
    });
    let d = '';
    for (let i = 0; i <= N; i++) {
      const p = pts[i % N], q = pts[(i + 1) % N], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      d += i === 0 ? `M${m[0].toFixed(2)} ${m[1].toFixed(2)}` : `Q${p[0].toFixed(2)} ${p[1].toFixed(2)} ${m[0].toFixed(2)} ${m[1].toFixed(2)}`;
    }
    return d + 'Z';
  }
  function svg(id, cls = '') {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '18 18 72 72'); // what launchers actually show
    if (cls) s.setAttribute('class', cls);
    s.innerHTML = document.getElementById(id).content.querySelector('svg').innerHTML;
    const art = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    art.setAttribute('transform', `translate(54 54) scale(${FIT[id]}) translate(-54 -54)`);
    [...s.children].slice(1).forEach((n) => art.appendChild(n));
    s.appendChild(art);
    s.querySelectorAll('[data-shape]').forEach((p) => p.setAttribute('d', shapePath(p.dataset.shape, Number(p.dataset.r), 54, 54 + Number(p.dataset.dy || 0), Number(p.dataset.rot || 0))));
    return s;
  }
  const grid = document.getElementById('grid');
  META.forEach(([name, idea], i) => {
    const id = 'i' + (i + 1);
    const card = document.createElement('div'); card.className = 'card';
    const hero = document.createElement('div'); hero.className = 'hero'; hero.appendChild(svg(id));
    const masks = document.createElement('div'); masks.className = 'masks';
    masks.appendChild(svg(id, 'sq')); masks.appendChild(svg(id, 'rs'));
    const home = document.createElement('div'); home.className = 'home'; home.appendChild(svg(id)); home.append('Worth It');
    masks.appendChild(home);
    card.append(hero, masks);
    card.insertAdjacentHTML('beforeend', `<h2><span class="num">${i + 1}</span>${name}</h2><p>${idea}</p>`);
    grid.appendChild(card);
  });
</script>
