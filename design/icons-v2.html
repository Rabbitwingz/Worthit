<style>
  :root { --bg: #FBF8FC; --card: #F5F2F7; --on: #1B1B21; --muted: #47464F; --chip: #E4DFFF; --on-chip: #1C1259; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Google Sans Flex", system-ui, sans-serif; background: var(--bg); color: var(--on); padding: 40px 16px 80px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 850; letter-spacing: -0.03em; font-variation-settings: "ROND" 100; }
  h3 { font-size: 26px; font-weight: 800; margin-top: 40px; font-variation-settings: "ROND" 100; }
  .lede { color: var(--muted); font-size: 18px; margin-top: 8px; max-width: 46em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--card); border-radius: 32px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .hero { display: flex; justify-content: center; padding: 8px 0; }
  .hero svg { width: 168px; height: 168px; border-radius: 50%; box-shadow: 0 10px 30px -10px rgba(40,30,110,.35); }
  .masks { display: flex; gap: 12px; justify-content: center; align-items: center; }
  .masks svg { width: 56px; height: 56px; }
  .masks .sq { border-radius: 18px; }
  .masks .rs { border-radius: 30%; }
  .masks .home { padding: 10px 12px; border-radius: 18px; background: linear-gradient(135deg, #3a3170, #1f4536); display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; font-size: 11px; }
  .masks .home svg { width: 44px; height: 44px; border-radius: 50%; }
  .num { display: inline-grid; place-items: center; min-width: 34px; height: 30px; padding: 0 6px; border-radius: 10px; background: var(--chip); color: var(--on-chip); font-weight: 800; font-size: 15px; margin-right: 8px; }
  h2 { font-size: 21px; font-weight: 750; display: flex; align-items: center; font-variation-settings: "ROND" 100; }
  p { color: var(--muted); font-size: 15px; line-height: 1.5; }

<script>
  const SETS = {
    'g-s': [
      ['S1', 'Scales, refined', 'Bolder lines and bigger pans so it reads at small sizes. Coin up, heart down: joy outweighs money.', .8],
      ['S2', 'Seesaw', 'Stripped right back: a chunky seesaw with a big gold coin vs a big heart. The most legible at 44px.', .8],
      ['S3', 'Hourglass scale', 'The scale’s pillar is an hourglass, so time is literally what holds the balance. On warm apricot.', .84],
      ['S4', 'Time vs joy', 'A gold scale on midnight ink weighing a clock against a heart. You’re trading time for joy.', .8],
    ],
    'g-c': [
      ['C1', 'Cheeky coin', 'Winking, tongue out, rosy cheeks. Maximum personality on soft apricot.', .8],
      ['C2', 'Heart-eyes coin', 'In love with a purchase that’s actually worth it. Heart eyes on fresh mint.', .8],
      ['C3', 'Starstruck coin', 'Sparkly star eyes and a big grin on iris. Pure delight.', .8],
      ['C4', 'Coin & hourglass', 'The happy coin with a little hourglass buddy: money + time, still super friendly.', .86],
    ],
    'g-h': [
      ['H1', 'Balancing act', 'The happy coin is the scale, balancing a clock against a heart on its head. Fun and full of meaning.', .82],
      ['H2', 'Kawaii seesaw', 'A smiling coin and a smiling heart on a seesaw, and the heart is winning. Playful and instantly clear.', .8],
    ],
  };
  const SHAPES = { cookie12: [12, .045] };
  function shapePath(name, r, cx, cy) {
    const [n, a] = SHAPES[name], N = 180, scale = r / (1 + a);
    const pts = Array.from({ length: N }, (_, i) => { const t = i / N * Math.PI * 2, k = 1 + a * Math.cos(n * t); return [cx + scale * k * Math.cos(t), cy + scale * k * Math.sin(t)]; });
    let d = '';
    for (let i = 0; i <= N; i++) { const p = pts[i % N], q = pts[(i + 1) % N], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; d += i === 0 ? `M${m[0].toFixed(2)} ${m[1].toFixed(2)}` : `Q${p[0].toFixed(2)} ${p[1].toFixed(2)} ${m[0].toFixed(2)} ${m[1].toFixed(2)}`; }
    return d + 'Z';
  }
  // Heart ~17×11 units at scale 1, centred on (cx, cy).
  const heart = (cx, cy, s) => { const P = (x, y) => `${(cx + x * s).toFixed(2)} ${(cy + y * s).toFixed(2)}`; return `M${P(0, 6)}C${P(-7, 1)} ${P(-8.5, -4)} ${P(-4.5, -5.3)}C${P(-2.5, -5.9)} ${P(-.7, -4.6)} ${P(0, -3)}C${P(.7, -4.6)} ${P(2.5, -5.9)} ${P(4.5, -5.3)}C${P(8.5, -4)} ${P(7, 1)} ${P(0, 6)}Z`; };
  // Four-point sparkle with soft concave sides.
  const spark = (cx, cy, r) => { const k = r * .28, P = (x, y) => `${(cx + x).toFixed(2)} ${(cy + y).toFixed(2)}`; return `M${P(0, -r)}Q${P(k, -k)} ${P(r, 0)}Q${P(k, k)} ${P(0, r)}Q${P(-k, k)} ${P(-r, 0)}Q${P(-k, -k)} ${P(0, -r)}Z`; };
  function svg(id, fit, cls = '') {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '18 18 72 72');
    if (cls) s.setAttribute('class', cls);
    s.innerHTML = document.getElementById(id).content.querySelector('svg').innerHTML;
    s.querySelectorAll('[data-shape]').forEach((p) => p.setAttribute('d', shapePath(p.dataset.shape, +p.dataset.r, +(p.dataset.cx || 54), +(p.dataset.cy || 54))));
    s.querySelectorAll('[data-heart]').forEach((p) => { const [x, y, k] = p.dataset.heart.split(' ').map(Number); p.setAttribute('d', heart(x, y, k)); });
    s.querySelectorAll('[data-spark]').forEach((p) => { const [x, y, r] = p.dataset.spark.split(' ').map(Number); p.setAttribute('d', spark(x, y, r)); });
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(54 54) scale(${fit}) translate(-54 -54)`);
    [...s.children].slice(1).forEach((n) => g.appendChild(n));
    s.appendChild(g);
    return s;
  }
  for (const [gid, items] of Object.entries(SETS)) {
    const grid = document.getElementById(gid);
    items.forEach(([id, name, idea, fit]) => {
      const card = document.createElement('div'); card.className = 'card';
      const hero = document.createElement('div'); hero.className = 'hero'; hero.appendChild(svg(id, fit));
      const masks = document.createElement('div'); masks.className = 'masks';
      masks.appendChild(svg(id, fit, 'sq')); masks.appendChild(svg(id, fit, 'rs'));
      const home = document.createElement('div'); home.className = 'home'; home.appendChild(svg(id, fit)); home.append('Worth It');
      masks.appendChild(home);
      card.append(hero, masks);
      card.insertAdjacentHTML('beforeend', `<h2><span class="num">${id}</span>${name}</h2><p>${idea}</p>`);
      grid.appendChild(card);
    });
  }
</script>
