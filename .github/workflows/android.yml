name: Build Worth It

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "README.md"]
  pull_request:
    paths-ignore: ["website/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Keep one signing key across builds so each new APK installs over the last one.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: worthit-signing-key-v1

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/WorthIt-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorthIt-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Worth It 1.0.${{ github.run_number }}
          body: |
            Download the APK below and open it on your Android phone to install.
            Built from ${{ github.sha }}.
          files: out/*.apk
          make_latest: true
